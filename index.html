function moneyPage(){return `<section class="panel"><h2>支出を記録</h2><div id="dailyBudget" class="budget"></div><div class="quick-title"><h2>商品をワンタップで記録</h2></div><p class="quick-hint">押すと今日の日付で、支出としてすぐ保存します。</p><div class="sortbar"><span class="muted">${db.products.length}件の商品</span>${productSortMenu()}</div><div class="quick">${sortedProducts().map(x=>`<button onclick="quick('${x.id}')">${esc(x.name)} · ${yen(x.amount)}<br><small>${esc(x.category)}</small></button>`).join('')||'<span class="muted">下の「商品登録」からよく使う商品を登録できます。</span>'}</div></section><section class="panel"><h2>手入力で記録</h2><form onsubmit="addEntry(event)"><div class="fields"><div class="field"><label>日付（自動入力）</label><input id="edate" type="date" required value="${today()}" autocomplete="off"></div><div class="field"><label>種類</label><select id="etype"><option selected>支出</option><option>収入</option></select></div><div class="field"><label>商品・内容</label><input id="ename" required placeholder="例：昼食"></div><div class="field"><label>カテゴリ</label><select id="ecat">${opts()}</select></div><div class="field"><label>金額（円）</label><input id="eamount" type="number" min="0" step="1" required></div><div><button class="primary">登録する</button></div></div></form></section><section class="panel"><h2>今日の記録</h2>${db.entries.filter(x=>x.date===today()).slice().reverse().map(x=>`<div class="entry"><div><span class="tag" style="background:${cat(x.category).color}">${esc(x.category)}</span> ${esc(x.name)}<div class="muted">${x.type}</div></div><b>${x.type==='収入'?'+':'−'}${yen(x.amount)}</b></div>`).join('')||'<p class="muted">今日の記録はまだありません。</p>'}</section><section class="panel"><h2>入出金履歴</h2>${db.entries.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,100).map(x=>`<div class="entry"><div><span class="tag" style="background:${cat(x.category).color}">${esc(x.category)}</span> ${esc(x.name)}<div class="muted">${esc(x.date)} · ${x.type}</div></div><div><b>${x.type==='収入'?'+':'−'}${yen(x.amount)}</b> <button class="small" onclic function dateKey(y,m,d){return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`}function nthWeekday(y,m,weekday,n){let first=new Date(Date.UTC(y,m-1,1)).getUTCDay();return 1+((weekday-first+7)%7)+(n-1)*7}function japaneseHolidays(y){let h=new Set(),add=(m,d)=>h.add(dateKey(y,m,d)),mon=(m,n)=>add(m,nthWeekday(y,m,1,n));add(1,1);mon(1,2);add(2,11);if(y>=2020)add(2,23);else if(y>=1989&&y!==2019)add(12,23);let vernal=Math.floor(20.8431+0.242194*(y-1980)-Math.floor((y-1980)/4)),autumn=Math.floor(23.2488+0.242194*(y-1980)-Math.floor((y-1980)/4));add(3,vernal);add(4,29);add(5,3);add(5,4);add(5,5);if(y>=2003)mon(7,3);else if(y>=1996)add(7,20);if(y>=2016)add(8,11);if(y>=2003)mon(9,3);else add(9,15);add(9,autumn);if(y>=2000)mon(10,2);else add(10,10);add(11,3);add(11,23);if(y===2019){add(4,30);add(5,1);add(10,22)}if(y===2020){h.delete(dateKey(y,7,20));h.delete(dateKey(y,10,12));add(7,23);add(7,24);add(8,10)}if(y===2021){h.delete(dateKey(y,7,nthWeekday(y,7,1,3)));h.delete(dateKey(y,8,11));h.delete(dateKey(y,10,nthWeekday(y,10,1,2)));add(7,22);add(7,23);add(8,8)}let base=[...h].sort();for(let k of base){let [yy,mm,dd]=k.split('-').map(Number);if(new Date(Date.UTC(yy,mm-1,dd)).getUTCDay()===0){let dt=new Date(Date.UTC(yy,mm-1,dd+1)),next;do{next=dateKey(dt.getUTCFullYear(),dt.getUTCMonth()+1,dt.getUTCDate());dt.setUTCDate(dt.getUTCDate()+1)}while(h.has(next));h.add(next)}}for(let m=1;m<=12;m++){let days=new Date(Date.UTC(y,m,0)).getUTCDate();for(let d=1;d<=days;d++){let k=dateKey(y,m,d),dt=new Date(Date.UTC(y,m-1,d)),prev=dateKey(y,m,d-1),after=dateKey(y,m,d+1);if(!h.has(k)&&h.has(prev)&&h.has(after))h.add(k)}}return h}function isJapaneseHoliday(date){let [y,m,d]=date.split('-').map(Number);return japaneseHolidays(y).has(dateKey(y,m,d))}function budgetFor(date){let [y,m,d]=date.split('-').map(Number),day=new Date(Date.UTC(y,m-1,d)).getUTCDay(),holiday=isJapaneseHoliday(date);return {amount:(day===0||day===6||holiday)?3000:1000,label:holiday?'祝日':(day===0||day===6)?'土日':'平日'}}function updateDailyBudget(){let el=document.getElementById('dailyBudget');if(!el)return;let date=document.getElementById('edate')?.value||today(),spent=sum(db.entries.filter(x=>x.date===date&&x.type==='支出'),x=>x.amount),b=budgetFor(date),left=b.amount-spent,pct=Math.min(100,spent/b.amount*100),dt=new Date(date+'T12:00:00');el.classList.toggle('over',spent>b.amount);el.innerHTML=`<div class="budgethead"><span><span class="daily-label">${dt.toLocaleDateString('ja-JP',{month:'numeric',day:'numeric',weekday:'short'})}の累計支出 · ${b.label}予算</span><br><strong>${yen(spent)} <small class="muted">/ ${yen(b.amount)}</small></strong></span><span style="text-align:right"><span class="daily-label">${left>=0?'あと使える額':'予算超過'}</span><br><strong>${yen(Math.abs(left))}</strong></span></div><div class="budgetbar"><i style="width:${pct}%"></i></div>`}function productSortMenu(){return `<select aria-label="商品並び替え" onchange="setProductSort(this.value)"><option value="category" ${productSort==='category'?'selected':''}>カテゴリ順</option><option value="amount-asc" ${productSort==='amount-asc'?'selected':''}>金額が安い順</option><option value="amount-desc" ${productSort==='amount-desc'?'selected':''}>金額が高い順</option><option value="name" ${productSort==='name'?'selected':''}>商品名順</option></select>`}function sortedProducts(){return db.products.slice().sort((a,b)=>productSort==='amount-asc'?a.amount-b.amount:productSort==='amount-desc'?b.amount-a.amount:productSort==='name'?a.name.localeCompare(b.name,'ja'):a.category.localeCompare(b.category,'ja')||a.name.localeCompare(b.name,'ja'))}function setProductSort(v){productSort=v;render()}function showToast(s){let e=document.getElementById('toast');if(!e)return;e.textContent=s;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1500)}

function months(n=12){let d=new Date();return Array.from({length:n},(_,i)=>{let t=new Date(d.getFullYear(),d.getMonth()-(n-1-i),1);return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')})}function chart(canvas,labels,series,kind='line'){let c=document.getElementById(canvas);if(!c)return;let w=c.clientWidth||600,h=270,r=window.devicePixelRatio||1;c.width=w*r;c.height=h*r;let ctx=c.getContext('2d');ctx.scale(r,r);ctx.clearRect(0,0,w,h);let left=54,right=14,top=20,bottom=40,iw=w-left-right,ih=h-top-bottom,max=Math.max(1,...series.flatMap(s=>s.values))*1.12;ctx.font='11px system-ui';ctx.fillStyle='#667085';ctx.strokeStyle='#e2e8f0';for(let i=0;i<=4;i++){let y=top+ih*i/4;ctx.beginPath();ctx.moveTo(left,y);ctx.lineTo(w-right,y);ctx.stroke();ctx.fillText(Math.round(max*(1-i/4)).toLocaleString(),2,y+4)}labels.forEach((x,i)=>{let px=left+iw*(i+.5)/labels.length;if(labels.length<=14||i%Math.ceil(labels.length/12)===0)ctx.fillText(x.slice(5),px-13,h-16)});series.forEach((s,j)=>{ctx.strokeStyle=s.color;ctx.fillStyle=s.color;if(kind==='bar'){s.values.forEach((v,i)=>{let bw=iw/labels.length/Math.max(2,series.length+1),x=left+iw*(i+.2)/labels.length+j*bw,y=top+ih*(1-v/max);ctx.fillRect(x,y,bw*.9,top+ih-y)})}else{ctx.lineWidth=2;ctx.beginPath();s.values.forEach((v,i)=>{let x=left+iw*(i+.5)/labels.length,y=top+ih*(1-v/max);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();s.values.forEach((v,i)=>{let x=left+iw*(i+.5)/labels.length,y=top+ih*(1-v/max);ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fill()})}})}function drawAnalysis(){let ms=months();chart('analysisChart',ms,[{color:'#ef4444',values:ms.map(m=>sum(db.entries.filter(x=>x.date.startsWith(m)&&x.type==='支出'),x=>x.amount))},{color:'#2563eb',values:ms.map(m=>sum(db.entries.filter(x=>x.date.startsWith(m)&&x.type==='収入'),x=>x.amount))}],'bar')}
function assetsPage(){let latest=db.assets.slice().sort((a,b)=>b.date.localeCompare(a.date))[0];return `<section class="panel"><h2>資産を記録</h2><p class="muted">同じ日付の記録は上書きされます。金額はその日の残高です。</p><form onsubmit="addAsset(event)"><div class="fields"><div><label>日付</label><input id="adate" type="date" value="${today()}" required></div><div><label>投資信託（円）</label><input id="afund" type="number" min="0" required value="${latest?.fund??''}"></div><div><label>現金（円）</label><input id="acash" type="number" min="0" required value="${latest?.cash??''}"></div><div><button class="primary">残高を記録</button></div></div></form></section><div class="statgrid"><div class="stat">投資信託<strong>${yen(latest?.fund)}</strong></div><div class="stat">現金<strong>${yen(latest?.cash)}</strong></div><div class="stat">総資産<strong>${yen((latest?.fund||0)+(latest?.cash||0))}</strong></div></div><section class="panel"><h2>月別総資産推移（各月の最終記録）</h2><canvas id="assetChart"></canvas></section><section class="panel"><h2>記録履歴</h2>${db.assets.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<div class="entry"><span>${x.date}</span><span>${yen(x.fund+x.cash)} <button class="small" onclick="remove('assets','${x.id}')">削除</button></span></div>`).join('')||'<p class="muted">記録なし</p>'}</section>`}function addAsset(e){e.preventDefault();let d=val('adate');db.assets=db.assets.filter(x=>x.date!==d);db.assets.push({id:id(),date:d,fund:+val('afund'),cash:+val('acash')});save();render()}function drawAssets(){let ms=months(),v=ms.map(m=>db.assets.filter(x=>x.date.startsWith(m)).sort((a,b)=>b.date.localeCompare(a.date))[0]);chart('assetChart',ms,[{color:'#2563eb',values:v.map(x=>x?x.fund+x.cash:0)}],'bar')}
function weightPage(){let a=db.weights.slice().sort((x,y)=>x.date.localeCompare(y.date)),last=a.at(-1),delta=n=>{if(!last)return '—';let d=new Date(last.date+'T12:00:00');d.setDate(d.getDate()-n);let old=a.filter(x=>x.date<=d.toISOString().slice(0,10)).at(-1);return old?(last.weight-old.weight>0?'+':'')+(last.weight-old.weight).toFixed(1)+' kg':'—'};return `<section class="panel"><h2>体重を記録</h2><form onsubmit="addWeight(event)"><div class="fields"><div><label>日付</label><input id="wdate" type="date" required value="${today()}"></div><div><label>体重（kg）</label><input id="wvalue" type="number" min="1" max="500" step="0.1" required placeholder="例：60.0"></div><div><button class="primary">記録する</button></div></div></form></section><div class="statgrid"><div class="stat">最新の体重<strong>${last?last.weight.toFixed(1)+' kg':'—'}</strong></div><div class="stat">7日前比<strong>${delta(7)}</strong></div><div class="stat">30日前比<strong>${delta(30)}</strong></div></div><section class="panel"><h2>体重推移（折れ線グラフ）</h2><canvas id="weightChart"></canvas></section><section class="panel"><h2>記録履歴</h2>${a.reverse().map(x=>`<div class="entry"><span>${x.date}</span><span>${x.weight.toFixed(1)} kg <button class="small" onclick="remove('weights','${x.id}')">削除</button></span></div>`).join('')||'<p class="muted">記録なし</p>'}</section>`}function addWeight(e){e.preventDefault();let d=val('wdate');db.weights=db.weights.filter(x=>x.date!==d);db.weights.push({id:id(),date:d,weight:+val('wvalue')});save();render()}function drawWeights(){let a=db.weights.slice().sort((x,y)=>x.date.localeCompare(y.date)).slice(-60);chart('weightChart',a.map(x=>x.date),[{color:'#8b5cf6',values:a.map(x=>x.weight)}])}
function syncPanel(){let signed=syncSession?.user?.email;return `<section class="panel"><h2>PC・iPhone間で同期</h2><p class="muted">同じSupabaseアカウントでログインすると、記録を端末間で同期します。同期設定とログイン情報はこの端末のブラウザに保存されます。パスワードは保存しません。</p><div class="fields"><div class="field"><label>Supabase Project URL</label><input id="syncUrl" type="url" value="${esc(syncConfig.url)}" placeholder="https://xxxx.supabase.co"></div><div class="field"><label>Publishable / anon key</label><input id="syncKey" type="text" value="${esc(syncConfig.key)}" placeholder="sb_publishable_... または anon key" autocomplete="off"></div></div><div class="row" style="margin-top:10px"><button onclick="saveSyncConfig()">接続設定を保存</button><a href="./setup-supabase.sql" download>同期用SQL</a></div><p class="muted" style="margin:8px 0 14px">初回のみSupabaseのSQL Editorで付属のSQLを実行し、Project Settings → APIからキーを設定してください。</p>${signed?`<div class="notice"><b>ログイン中：</b>${esc(signed)}</div><div class="row"><button class="primary" onclick="syncNow()">今すぐ同期</button><button onclick="chooseCloud()">クラウドの記録を使う</button><button onclick="chooseLocal()">この端末の記録を保存</button><button onclick="syncLogout()">ログアウト</button></div>`:`<form onsubmit="syncAuthAction(event,'login')"><div class="fields"><div class="field"><label>メールアドレス</label><input id="syncEmail" type="email" autocomplete="username" required></div><div class="field"><label>パスワード</label><input id="syncPassword" type="password" autocomplete="current-password" required minlength="6"></div></div><div class="row" style="margin-top:10px"><button class="primary" type="submit">ログインして同期</button><button type="button" onclick="syncAuthAction(event,'signup')">新規アカウント登録</button></div></form>`}<p id="sync-status" class="muted" role="status" style="margin-top:12px">${esc(cloudMessage)}</p>${cloudConflict?`<p class="warning"><b>${accountMismatch?'このブラウザには別アカウントの記録があります。':'PCとiPhoneの両方で変更があります。'}</b>上の「クラウドの記録を使う」か「この端末の記録を保存」を選んでください。選んだ側の記録が同期先になります。</p>`:''}</section>`}function dataPage(){return `${syncPanel()}<section class="panel"><h2>商品登録</h2><form onsubmit="addProduct(event)"><div class="fields"><div><label>商品名</label><input id="pname" required></div><div><label>カテゴリ</label><select id="pcat">${opts()}</select></div><div><label>金額（円）</label><input id="pamount" type="number" min="0" required></div><div><button class="primary">商品を登録</button></div></div></form><div class="sortbar" style="margin-top:14px"><span class="muted">登録済み商品 ${db.products.length}件</span>${productSortMenu()}</div>${sortedProducts().map(x=>`<div class="entry"><span>${esc(x.name)} · <span class="tag" style="background:${cat(x.category).color}">${esc(x.category)}</span> · ${yen(x.amount)}</span><button class="small" onclick="remove('products','${x.id}')">削除</button></div>`).join('')}</section><section class="panel"><h2>カテゴリ設定</h2><form onsubmit="addCat(event)"><div class="fields"><div><label>カテゴリ名</label><input id="cname" required></div><div><label>色</label><input id="ccolor" type="color" value="#2563eb"></div><div><button class="primary">追加</button></div></div></form>${db.categories.map(x=>`<div class="entry"><span><span class="tag" style="background:${x.color}">${esc(x.name)}</span></span><button class="small" onclick="removeCat('${encodeURIComponent(x.name)}')">削除</button></div>`).join('')}</section><section class="panel"><h2>CSV出力</h2><p class="muted">各データを個別にCSV形式で保存できます。Excelで開けるUTF-8（BOM付き）です。</p><div class="row">${[['entries','お小遣い帳'],['products','商品'],['categories','カテゴリ'],['assets','資産'],['weights','体重']].map(([k,n])=>`<button onclick="exportCsv('${k}')">${n} CSV</button>`).join('')}</div></section><section class="panel"><h2>バックアップ・復元</h2><p class="muted">機種変更や同期前の保全にはJSONバックアップを使えます。</p><div class="row"><button onclick="backup()">全データをバックアップ</button><input type="file" accept=".json,application/json" onchange="restore(event)" aria-label="バックアップを読み込む"></div><p class="warning">記録は端末内にも保存されます。クラウド同期を使わない場合はiPhoneとWindows間で自動同期されません。</p></section>`}
function addProduct(e){e.preventDefault();db.products.push({id:id(),name:val('pname'),category:val('pcat'),amount:+val('pamount')});save();render();showToast('商品を登録しました。支出記録ページからワンタップで記録できます')}function addCat(e){e.preventDefault();let n=val('cname').trim();if(db.categories.some(x=>x.name===n))return alert('同名カテゴリがあります');db.categories.push({name:n,color:val('ccolor')});save();render()}function removeCat(n){n=decodeURIComponent(n);if(db.entries.some(x=>x.category===n)||db.products.some(x=>x.category===n))return alert('使用中のカテゴリは削除できません');db.categories=db.categories.filter(x=>x.name!==n);save();render()}function download(name,content,type){let u=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function exportCsv(k){let cols={entries:['date','type','name','category','amount'],products:['name','category','amount'],categories:['name','color'],assets:['date','fund','cash'],weights:['date','weight']}[k];let q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';download(k+'.csv','\ufeff'+[cols.join(','),...db[k].map(x=>cols.map(c=>q(x[c])).join(','))].join('\r\n'),'text/csv;charset=utf-8')}function backup(){download('life-record-backup.json',JSON.stringify(db,null,2),'application/json')}async function restore(e){let f=e.target.files[0];if(!f)return;try{let x=JSON.parse(await f.text());if(!['entries','products','categories','assets','weights'].every(k=>Array.isArray(x[k])))throw Error();if(!confirm('現在のデータをバックアップの内容で置き換えますか？'))return;db=x;save();render()}catch{alert('有効なバックアップファイルではありません')}}function setCloudMessage(s){cloudMessage=s;let el=document.getElementById('sync-status');if(el)el.textContent=s}function saveSyncConfig(){let url=document.getElementById('syncUrl').value.trim().replace(/\/$/,''),key=document.getElementById('syncKey').value.trim();if(url&&!/^https:\/\/[^/]+$/.test(url)){alert('Project URLは https://xxxx.supabase.co の形式で入力してください');return}if(syncSession&&url!==syncConfig.url){if(!confirm('Project URLを変更すると、この端末の同期ログインを解除します。続けますか？'))return;localStorage.removeItem(SESSION_KEY);syncSession=null;cloudReady=false;localStorage.removeItem(OWNER_KEY);localStorage.removeItem(SNAPSHOT_KEY)}syncConfig={url,key};localStorage.setItem(SYNC_CONFIG_KEY,JSON.stringify(syncConfig));render();setCloudMessage('接続設定を保存しました。SQLを実行後、ログインしてください。')}async function authRequest(path,body){if(!syncConfig.url||!syncConfig.key)throw Error('先にProject URLとPublishable / anon keyを設定してください');let r=await fetch(syncConfig.url+'/auth/v1/'+path,{method:'POST',headers:{'apikey':syncConfig.key,'Content-Type':'application/json'},body:JSON.stringify(body)}),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.msg||j.message||j.error_description||'認証に失敗しました');return j}async function syncAuthAction(e,mode){e?.preventDefault?.();try{let email=document.getElementById('syncEmail')?.value.trim(),password=document.getElementById('syncPassword')?.value;if(!email||!password)throw Error('メールアドレスとパスワードを入力してください');let r=mode==='signup'?await authRequest('signup?redirect_to='+encodeURIComponent(new URL('./',location.href).href),{email,password}):await authRequest('token?grant_type=password',{email,password});if(!r.access_token){setCloudMessage('登録確認メールを送信しました。メール内の確認後にログインしてください。');return}let oldOwner=localStorage.getItem(OWNER_KEY);setSyncSession(r);accountMismatch=!!(oldOwner&&oldOwner!==r.user?.id&&hasRecords(db));cloudReady=true;render();if(accountMismatch){cloudConflict=true;setCloudMessage('この端末には別のアカウントの記録があります。どちらの記録を使うか選んでください');return}setCloudMessage('ログインしました。クラウドの記録を確認しています…');await syncState(true)}catch(err){setCloudMessage('同期ログインエラー：'+err.message)}}function setSyncSession(s){syncSession={...s,expires_at:s.expires_at||Math.floor(Date.now()/1000)+(s.expires_in||3600)};localStorage.setItem(SESSION_KEY,JSON.stringify(syncSession))}async function refreshSession(){if(!syncSession?.refresh_token)throw Error('ログイン期限が切れています。再ログインしてください');let r=await authRequest('token?grant_type=refresh_token',{refresh_token:syncSession.refresh_token});setSyncSession(r)}async function supa(path,{method='GET',body=null,prefer='',retry=true}={}){if(!syncConfig.url||!syncConfig.key)throw Error('Supabase接続設定がありません');if(syncSession?.access_token&&syncSession.expires_at<Date.now()/1000+60)await refreshSession();let h={'apikey':syncConfig.key,'Content-Type':'application/json'};if(syncSession?.access_token)h.Authorization='Bearer '+syncSession.access_token;if(prefer)h.Prefer=prefer;let r=await fetch(syncConfig.url+path,{method,headers:h,body:body?JSON.stringify(body):undefined});if(r.status===401&&retry&&syncSession?.refresh_token){await refreshSession();return supa(path,{method,body,prefer,retry:false})}let j=await r.json().catch(()=>null);if(!r.ok)throw Error(j?.message||j?.error_description||j?.hint||`Supabaseエラー (${r.status})`);return j}async function remoteData(){let uid=syncSession?.user?.id;if(!uid)throw Error('同期ログインが必要です');return (await supa('/rest/v1/life_record_data?select=data,updated_at&user_id=eq.'+encodeURIComponent(uid)))?.[0]||null}async function writeRemote(payload=db){let uid=syncSession?.user?.id;if(!uid)throw Error('同期ログインが必要です');let r=await supa('/rest/v1/life_record_data?on_conflict=user_id',{method:'POST',body:{user_id:uid,data:payload,updated_at:new Date().toISOString()},prefer:'resolution=merge-duplicates,return=representation'});return Array.isArray(r)?r[0]:r}function hasRecords(d){return ['entries','products','assets','weights'].some(k=>(d?.[k]||[]).length>0)}function syncSnapshot(d,updatedAt){localStorage.setItem(SNAPSHOT_KEY,JSON.stringify({data:d,updated_at:updatedAt||null}));if(syncSession?.user?.id)localStorage.setItem(OWNER_KEY,syncSession.user.id)}function snapshotState(){try{return JSON.parse(localStorage.getItem(SNAPSHOT_KEY)||'null')}catch{return null}}async function syncState(manual){if(!syncSession?.access_token)return;clearTimeout(syncTimer);cloudReady=true;let remote=await remoteData();remoteCache=remote;if(accountMismatch){cloudConflict=true;render();setCloudMessage('この端末には別のアカウントの記録があります。クラウドを読み込むか、この記録を今のアカウントへ保存するか選んでください');return}let snap=snapshotState(),localChanged=snap?JSON.stringify(db)!==JSON.stringify(snap.data):hasRecords(db),remoteChanged=snap?JSON.stringify(remote?.data||null)!==JSON.stringify(snap.data||null):hasRecords(remote?.data);if(!remote){let saved=await writeRemote(db);syncSnapshot(db,saved?.updated_at);cloudConflict=false;setCloudMessage('この端末のデータをクラウドに保存しました');return}if(!snap&&!hasRecords(db)){db=remote.data||db;localStorage.setItem(K,JSON.stringify(db));syncSnapshot(db,remote.updated_at);cloudConflict=false;render();setCloudMessage('クラウドの記録をこの端末に読み込みました');return}if(localChanged&&remoteChanged){cloudConflict=true;render();setCloudMessage('両方の端末で記録が変わっています。どちらを使うか選んでください');return}if(remoteChanged&&!localChanged){db=remote.data||db;localStorage.setItem(K,JSON.stringify(db));syncSnapshot(db,remote.updated_at);cloudConflict=false;render();setCloudMessage('クラウドの最新記録を読み込みました');return}if(localChanged&&!remoteChanged){let saved=await writeRemote(db);syncSnapshot(db,saved?.updated_at||remote.updated_at);cloudConflict=false;setCloudMessage('この端末の変更をクラウドに同期しました');return}syncSnapshot(db,remote.updated_at);cloudConflict=false;setCloudMessage('PC・iPhone間で同期済み')}async function syncNow(){try{setCloudMessage('同期しています…');await syncState(true)}catch(e){setCloudMessage('同期エラー：'+e.message)}}async function chooseCloud(){try{let remote=await remoteData();if(!remote)return alert('クラウドに記録がありません。この端末の記録を使う場合は「この端末の記録を保存」を選んでください');localStorage.setItem('life-record-pre-cloud-'+Date.now(),JSON.stringify(db));download('life-record-before-cloud-load.json',JSON.stringify(db,null,2),'application/json');db=remote.data||db;localStorage.setItem(K,JSON.stringify(db));syncSnapshot(db,remote.updated_at);cloudConflict=false;accountMismatch=false;render();setCloudMessage('クラウドの記録に切り替えました。この端末の変更前データもブラウザ内にバックアップしました')}catch(e){setCloudMessage('クラウド読み込みエラー：'+e.message)}}async function chooseLocal(){try{let remote=await remoteData();if(remote?.data){localStorage.setItem('life-record-pre-local-upload-'+Date.now(),JSON.stringify(remote.data));download('life-record-cloud-before-overwrite.json',JSON.stringify(remote.data,null,2),'application/json')}let saved=await writeRemote(db);syncSnapshot(db,saved?.updated_at);cloudConflict=false;accountMismatch=false;render();setCloudMessage('この端末の記録でクラウドを更新しました')}catch(e){setCloudMessage('クラウド保存エラー：'+e.message)}}async function syncLogout(){try{if(syncSession?.access_token)await fetch(syncConfig.url+'/auth/v1/logout',{method:'POST',headers:{apikey:syncConfig.key,Authorization:'Bearer '+syncSession.access_token}})}catch{}localStorage.removeItem(SESSION_KEY);syncSession=null;cloudReady=false;cloudConflict=false;render();setCloudMessage('ログアウトしました。記録はこの端末に残っています')}async function resumeSync(){if(!syncSession?.refresh_token)return;try{if(syncSession.expires_at<Date.now()/1000+60)await refreshSession();let oldOwner=localStorage.getItem(OWNER_KEY);accountMismatch=!!(oldOwner&&oldOwner!==syncSession.user?.id&&hasRecords(db));cloudReady=true;if(accountMismatch){cloudConflict=true;render();setCloudMessage('この端末には別のアカウントの記録があります。どちらの記録を使うか選んでください');return}await syncState(false)}catch(e){cloudReady=false;setCloudMessage('クラウド同期を再開できません：'+e.message)}}window.addEventListener('online',()=>{if(syncSession?.access_token)syncState(false).catch(e=>setCloudMessage('同期エラー：'+e.message))});window.addEventListener('resize',()=>{if(page==='analysis')drawAnalysis();if(page==='assets')drawAssets();if(page==='weight')drawWeights()});render();setTimeout(resumeSync,200);if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
